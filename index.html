<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古法数理 · 奇门十阵</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: rgba(24, 24, 34, 0.88);
            --card-locked: rgba(18, 18, 24, 0.55);
            --gold-main: #d4af37;
            --gold-light: #f3e5ab;
            --text-color: #e0e0e0;
            --border-gold: rgba(212, 175, 55, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 35px 15px;
            position: relative;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 背景固定罗盘 */
        .bg-compass {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 90vw;
            max-width: 460px;
            max-height: 460px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.1);
            pointer-events: none;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-compass::before {
            content: '';
            width: 75%;
            height: 75%;
            border-radius: 50%;
            border: 1px dashed rgba(212, 175, 55, 0.15);
        }

        /* 顶部区 */
        .header {
            z-index: 1;
            text-align: center;
            margin-bottom: 18px;
        }

        .taiji-wrap {
            width: 68px;
            height: 68px;
            margin: 0 auto 12px auto;
        }

        .taiji-svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            animation: rotate 25s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            color: var(--gold-main);
            font-size: 1.9rem;
            letter-spacing: 4px;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(212, 175, 55, 0.65);
            letter-spacing: 2px;
        }

        /* 十宫格容器 */
        .grid-container {
            z-index: 1;
            width: 100%;
            max-width: 460px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin: 10px 0;
        }

        /* 单个游戏卡片 */
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* 已解锁可玩状态 */
        .game-card.unlocked:active {
            transform: scale(0.96);
            border-color: var(--gold-main);
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
        }

        .game-badge {
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-main);
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 10px;
        }

        .game-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold-light);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .game-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }

        /* 未解锁（敬请期待）状态 */
        .game-card.locked {
            background: var(--card-locked);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            box-shadow: none;
            cursor: default;
        }

        .game-card.locked .game-badge {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .game-card.locked .game-icon {
            opacity: 0.35;
            filter: grayscale(100%);
        }

        .game-card.locked .game-title {
            color: rgba(255, 255, 255, 0.4);
        }

        .game-card.locked .game-desc {
            color: rgba(255, 255, 255, 0.25);
        }

        .footer-text {
            z-index: 1;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 25px;
            letter-spacing: 2px;
        }

        /* 提示弹窗（点击未解锁卡片时） */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(22, 22, 30, 0.95);
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.95rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="bg-compass"></div>

    <div class="header">
        <div class="taiji-wrap">
            <svg class="taiji-svg" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="98" fill="#d4af37" stroke="#d4af37" stroke-width="2"/>
                <path d="M 100,2 A 98,98 0 0,0 100,198 A 49,49 0 0,1 100,100 A 49,49 0 0,0 100,2" fill="#0b0b0e"/>
                <path d="M 100,198 A 98,98 0 0,0 100,2 A 49,49 0 0,1 100,100 A 49,49 0 0,0 100,198" fill="#d4af37"/>
                <circle cx="100" cy="51" r="14" fill="#d4af37"/>
                <circle cx="100" cy="149" r="14" fill="#0b0b0e"/>
            </svg>
        </div>
        <h1>奇门数理 · 十阵</h1>
        <div class="subtitle">点击阵法 · 开启心智推演</div>
    </div>

    <div class="grid-container" id="game-grid">
        <!-- 由下方 JS 自动渲染十个阵法 -->
    </div>

    <div class="footer-text">古代数学智慧 · 持续封印解锁中</div>

    <div class="toast" id="toast">此阵法尚在推演封印中，敬请期待</div>

    <script>
        // 十个小游戏配置列表（以后新增游戏，只需把 locked 改为 false，并填上 url 即可）
        const games = [
            {
                id: "第一阵",
                title: "古法猜心术",
                desc: "默想1~60数字，六阵洞悉内心",
                icon: "🧭",
                url: "game1.html",
                locked: false
            },
            {
                id: "第二阵",
                title: "生辰神算",
                desc: "五步秘术推演，直指隐藏生辰",
                icon: "☯️",
                url: "game2.html",
                locked: false
            },
            {
   		id: "第三阵",
   		title: "乾坤读心",
               desc: "推算两位数差值，水晶洞悉符文",
               icon: "🔮",
               url: "game3.html",
               locked: false
            },
            {
                id: "第四阵",
                title: "九宫幻方",
                desc: "天机推演中...",
                icon: "📜",
                url: "",
                locked: true
            },
            {
                id: "第五阵",
                title: "古灵魔阵",
                desc: "矩阵探秘",
                icon: "🗝️",
                url: "game5.html",
                locked: false
            },
            {
                id: "第六阵",
                title: "生肖秘卜",
                desc: "天机推演中...",
                icon: "🐉",
                url: "",
                locked: true
            },
            {
                id: "第七阵",
                title: "姓氏天机",
                desc: "天机推演中...",
                icon: "🏮",
                url: "",
                locked: true
            },
            {
                id: "第八阵",
                title: "扑克预言",
                desc: "天机推演中...",
                icon: "🃏",
                url: "",
                locked: true
            },
            {
                id: "第九阵",
                title: "时空逆转",
                desc: "天机推演中...",
                icon: "⏳",
                url: "",
                locked: true
            },
            {
                id: "第十阵",
                title: "万象归一",
                desc: "天机推演中...",
                icon: "✨",
                url: "",
                locked: true
            }
        ];

        const grid = document.getElementById('game-grid');
        let toastTimer = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 渲染十宫格
        games.forEach(game => {
            if (!game.locked) {
                const a = document.createElement('a');
                a.className = 'game-card unlocked';
                a.href = game.url;
                a.innerHTML = `
                    <div class="game-badge">${game.id} · 已开启</div>
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="game-desc">${game.desc}</div>
                `;
                grid.appendChild(a);
            } else {
                const div = document.createElement('div');
                div.className = 'game-card locked';
                div.onclick = () => showToast(`【${game.id}】尚在推演封印中，敬请期待`);
                div.innerHTML = `
                    <div class="game-badge">${game.id} · 封印</div>
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="game-desc">${game.desc}</div>
                `;
                grid.appendChild(div);
            }
        });
    </script>
</body>
</html>
